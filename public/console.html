<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Docket">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<title>Docket — Task &amp; Case Console</title>
<style>
:root{
  /* fonts (shared) */
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* ---- default palette = Chambers ---- */
  --ink:#1b2233; --ink-2:#5a6072; --paper:#f5f2ea; --card:#ffffff; --line:#e7e0cf;
  --seal:#7c1f2b; --steel:#2b5f75; --ok:#1f6b4a; --warn:#9a6410; --crit:#a3212f;
  --shadow:0 1px 2px rgba(22,33,62,.05),0 12px 28px rgba(22,33,62,.05);
  --head-bg:#20283c; --head-fg:#ffffff; --head-accent:#c9a25a;
  --tab-bg:#28324a; --tab-fg:#aeb6cc; --tab-on:#ffffff; --tab-line:transparent; --tab-pill:transparent;
  --font-head:var(--serif); --radius:12px; --accent:#20283c; --accent-2:#c9a25a;
  --field:#fbfcfd; --field-2:#f0f2f6; --chip:#eef1f6;
  --btn-fg:#fff; --head-glass:rgba(32,40,60,.82); --tab-glass:rgba(40,50,74,.72); --sheet-glass:rgba(245,242,234,.86);
}
/* ============================ THEMES ============================ */
body.theme-chambers{ /* same as :root default — explicit for the picker */
  --ink:#1b2233; --ink-2:#5a6072; --paper:#f5f2ea; --card:#fff; --line:#e7e0cf;
  --head-bg:#20283c; --head-fg:#fff; --head-accent:#c9a25a;
  --tab-bg:#28324a; --tab-fg:#aeb6cc; --tab-on:#fff;
  --font-head:var(--serif); --radius:12px; --accent:#20283c; --accent-2:#c9a25a;
  --field:#fbfcfd; --field-2:#f0f2f6; --chip:#eef1f6;
  --btn-fg:#fff; --head-glass:rgba(32,40,60,.82); --tab-glass:rgba(40,50,74,.72); --sheet-glass:rgba(245,242,234,.86);
}
body.theme-slate{
  --ink:#15171d; --ink-2:#6b7280; --paper:#fafafb; --card:#fff; --line:#ececf1;
  --seal:#c33d30; --steel:#4646c8; --ok:#1f7a54; --warn:#b0730f; --crit:#d1483a;
  --head-bg:#ffffff; --head-fg:#15171d; --head-accent:#5b5bd6;
  --tab-bg:#ffffff; --tab-fg:#6b7280; --tab-on:#5b5bd6; --tab-line:#ececf1;
  --font-head:var(--sans); --radius:14px; --accent:#5b5bd6; --accent-2:#5b5bd6;
  --field:#fbfbfd; --field-2:#f4f4f7; --chip:#f4f4f7;
  --shadow:0 1px 3px rgba(16,24,40,.05);
  --btn-fg:#fff; --head-glass:rgba(255,255,255,.8); --tab-glass:rgba(255,255,255,.78); --sheet-glass:rgba(250,250,251,.9);
}
body.theme-ivory{
  --ink:#282320; --ink-2:#6f6658; --paper:#f1ece4; --card:#fffdfb; --line:#ece4d6;
  --seal:#a3212f; --steel:#1f6b4a; --ok:#1f6b4a; --warn:#9a6410; --crit:#a3212f;
  --head-bg:#fffdfb; --head-fg:#282320; --head-accent:#1f6b4a;
  --tab-bg:#fffdfb; --tab-fg:#6f6658; --tab-on:#fff; --tab-line:#e8e0d2; --tab-pill:#f4efe7;
  --font-head:var(--sans); --radius:18px; --accent:#1f6b4a; --accent-2:#c8892b;
  --field:#fffdfb; --field-2:#f4efe7; --chip:#f4efe7;
  --shadow:0 2px 5px rgba(40,35,32,.045),0 16px 34px rgba(40,35,32,.05);
  --btn-fg:#fff; --head-glass:rgba(255,253,251,.82); --tab-glass:rgba(255,253,251,.8); --sheet-glass:rgba(255,253,251,.9);
}
body.theme-graphite{
  --ink:#e7ecf3; --ink-2:#94a1b2; --paper:#0d1016; --card:#171d27; --line:#2a323f;
  --seal:#ff6b81; --steel:#4bd0c0; --ok:#4bd0c0; --warn:#f0a24b; --crit:#ff6b81;
  --head-bg:#141922; --head-fg:#e7ecf3; --head-accent:#4bd0c0;
  --tab-bg:#10141c; --tab-fg:#8493a6; --tab-on:#141922; --tab-line:#2a323f; --tab-pill:#1a212c;
  --font-head:var(--sans); --radius:16px; --accent:#4bd0c0; --accent-2:#f0a24b;
  --field:#1a212c; --field-2:#222b38; --chip:#222b38;
  --shadow:0 12px 34px rgba(0,0,0,.4);
  --btn-fg:#06232a; --head-glass:rgba(20,25,34,.72); --tab-glass:rgba(16,20,28,.66); --sheet-glass:rgba(23,29,39,.92);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
a{color:var(--steel)}
.mono{font-family:var(--mono)}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px 96px}

/* Masthead */
header.top{background:var(--head-bg);color:var(--head-fg);position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.14);border-bottom:2px solid var(--head-accent)}
.top-in{max-width:1040px;margin:0 auto;padding:11px 14px;display:flex;align-items:center;gap:12px}
.lockup{display:flex;align-items:center;gap:11px;min-width:0}
.emblem{height:38px;width:auto;display:block;flex:0 0 auto}
.wordmark .wm{font-family:var(--font-head);font-weight:700;font-size:17px;letter-spacing:.13em;line-height:1;color:var(--head-fg)}
.wordmark .ws{font-size:10px;letter-spacing:.04em;margin-top:3px;color:var(--head-fg);opacity:.62}
.brand{font-family:var(--serif);font-size:19px;letter-spacing:.02em}
.brand span{color:var(--head-accent)}
.clock{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--head-fg);opacity:.72;text-align:right;line-height:1.25}
.who{display:flex;align-items:center;gap:8px}
.who .whoname,.who > div:not(.avatar){color:var(--head-fg)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--head-accent);color:var(--head-bg);display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--sans)}
nav.tabs{background:var(--tab-bg);overflow-x:auto;position:sticky;top:60px;z-index:39;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--tab-line)}
nav.tabs .n{max-width:1040px;margin:0 auto;display:flex;gap:2px;padding:0 8px;white-space:nowrap}
nav.tabs button{background:none;border:0;color:var(--tab-fg);padding:12px 12px;font-size:13px;font-family:var(--sans);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
nav.tabs button.on{color:var(--tab-on);border-bottom-color:var(--head-accent);font-weight:600}
nav.tabs .pill{background:var(--seal);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:5px;font-family:var(--mono)}
/* Pill-style tabs (ivory / graphite) */
body.tabs-pill nav.tabs .n{gap:6px;padding:9px 10px}
body.tabs-pill nav.tabs button{border:1px solid var(--tab-line);border-radius:22px;padding:8px 14px;background:var(--tab-pill)}
body.tabs-pill nav.tabs button.on{background:var(--head-accent);color:var(--head-bg);border-color:var(--head-accent)}
/* Theme picker swatches */
.theme-row{display:flex;align-items:center;justify-content:space-between;width:100%;margin:9px 0;padding:12px 14px;text-align:left}
.theme-row.sel{border-color:var(--accent);border-width:2px;padding:11px 13px}
.theme-swatch{width:46px;height:30px;border-radius:8px;flex:0 0 auto;border:1px solid rgba(0,0,0,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.tsw-chambers{background:linear-gradient(120deg,#20283c 0 52%,#c9a25a 52% 100%)}
.tsw-slate{background:linear-gradient(120deg,#f4f4f7 0 52%,#5b5bd6 52% 100%)}
.tsw-ivory{background:linear-gradient(120deg,#fffdfb 0 52%,#1f6b4a 52% 100%)}
.tsw-graphite{background:linear-gradient(120deg,#141922 0 52%,#4bd0c0 52% 100%)}
.iconbtn{margin-left:6px;padding:4px 9px;font-size:15px;line-height:1}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
.card .pad{padding:14px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 4px}
.sec-head h2{font-size:20px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:11.5px}

/* Docket strip = signature element */
.docket{display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin:10px 0;overflow:hidden;cursor:pointer}
.docket:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.spine{width:7px;flex:0 0 7px;background:var(--ink-2)}
.spine.Low{background:#9aa4bb}.spine.Medium{background:var(--steel)}
.spine.High{background:var(--warn)}.spine.Critical{background:var(--crit)}
.docket .body{padding:11px 12px;flex:1;min-width:0}
.docket .no{font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.06em}
.docket h3{font-size:16px;margin:2px 0 4px;line-height:1.25}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11px;font-family:var(--mono);padding:2px 7px;border-radius:4px;background:var(--chip);color:var(--ink-2);border:1px solid var(--line)}
.tag.st-Completed{background:#e6f2ec;color:var(--ok);border-color:#bfdfd0}
.tag.st-InProgress{background:#e7eef3;color:var(--steel);border-color:#c6d9e3}
.tag.st-Blocked{background:#fbe9ea;color:var(--crit);border-color:#f0c9cc}
.tag.st-NotStarted{background:#f1f2f5}
.tag.st-Awaitinginput{background:#fbf1e0;color:var(--warn);border-color:#eddcbc}
.tag.st-Reassigned{background:#efe9f5;color:#5b3f86;border-color:#dbcfe9}
.tag.due{background:var(--seal);color:#fff;border-color:var(--seal)}
.tag.overdue{background:var(--crit);color:#fff;border-color:var(--crit)}
.tag.hear{background:#1e2b4d;color:#fff;border-color:#1e2b4d}

/* Forms */
label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:12px 0 4px;letter-spacing:.01em}
label .req{color:var(--seal)}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--field);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--steel);outline-offset:0;background:var(--card)}
textarea{min-height:70px;resize:vertical}
input[readonly]{background:var(--field-2);color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--chip);border:1px solid var(--line);padding:6px 10px;border-radius:20px;cursor:pointer;font-weight:500;color:var(--ink)}
.chk input{width:auto;padding:0;margin:0}
.chk.on{background:var(--field-2);border-color:var(--steel)}
button.btn{font:inherit;font-size:14px;font-weight:600;padding:10px 16px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--btn-fg);cursor:pointer}
button.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
button.btn.seal{background:var(--seal);border-color:var(--seal)}
button.btn.sm{padding:6px 11px;font-size:13px}
button.btn:disabled{opacity:.5}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.banner{border-radius:9px;padding:11px 13px;margin:12px 0;font-size:14px;border:1px solid}
.banner.warn{background:#fdf4e3;border-color:#e8d3a8;color:#6d4a0d}
.banner.crit{background:#fbeaec;border-color:#eec4c9;color:#7d1a25}
.banner.ok{background:#e8f3ed;border-color:#c2ddcf;color:#17553a}
.kv{display:grid;grid-template-columns:132px 1fr;gap:4px 10px;font-size:13.5px;margin:8px 0}
.kv .k{color:var(--ink-2);font-size:12px;padding-top:2px}
.log{border-left:2px solid var(--line);margin:8px 0 0;padding-left:12px}
.log .e{margin-bottom:14px}
.log .e .st{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.thumb{width:100%;max-width:320px;border-radius:8px;border:1px solid var(--line);display:block;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.stat{display:flex;gap:0;flex-wrap:wrap}
.stat div{flex:1;min-width:88px;padding:12px;border-right:1px solid var(--line)}
.stat div:last-child{border-right:0}
.stat b{display:block;font-family:var(--serif);font-size:26px;line-height:1}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.sheet{position:fixed;inset:0;background:rgba(10,15,30,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{background:var(--paper);width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 14px 40px}
@media(min-width:720px){.sheet{align-items:center}.sheet .inner{border-radius:14px;max-height:88vh}}
.sheet .bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sheet .bar button{margin-left:auto}
video,canvas.cap{width:100%;border-radius:8px;background:#111;display:block}
.hide{display:none!important}
.center{text-align:center;padding:34px 12px;color:var(--ink-2)}
.footnote{font-size:11.5px;color:var(--ink-2);margin-top:6px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
::-webkit-scrollbar{height:6px;width:6px}::-webkit-scrollbar-thumb{background:#c3c9d6;border-radius:3px}
@media (prefers-reduced-motion:no-preference){.docket{transition:transform .12s ease}.docket:active{transform:scale(.995)}}

/* ===================== iPhone-style frosted glass + motion ===================== */
/* Soft ambient background so translucent surfaces have depth to blur. */
body{background:
  radial-gradient(1100px 560px at 12% -8%, rgba(124,31,43,.055), transparent 60%),
  radial-gradient(950px 520px at 100% -4%, rgba(43,95,117,.075), transparent 55%),
  var(--paper);
  background-attachment:fixed}

/* Frosted surfaces — only where it reads well (chrome + sheets), content stays solid. */
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  header.top{background:var(--head-glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 1px 0 rgba(255,255,255,.04),0 6px 20px rgba(0,0,0,.12)}
  nav.tabs{background:var(--tab-glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
  .sheet{background:rgba(10,15,30,.30);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
  .sheet .inner{background:var(--sheet-glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
}

/* Thin Safari-style progress bar: acknowledges every tap the instant the network starts. */
#netbar{position:fixed;top:0;left:0;height:2.5px;width:0;z-index:100;pointer-events:none;
  background:linear-gradient(90deg,var(--steel),#c9a25a);opacity:0;box-shadow:0 0 10px rgba(201,162,90,.55)}
#netbar.on{opacity:1;width:82%;transition:width 9s cubic-bezier(.08,.72,.28,1),opacity .18s ease}
#netbar.done{opacity:0;width:100%;transition:width .2s ease,opacity .45s ease .05s}

/* Sheet: dim fades in, panel springs up. */
.sheet{animation:glassFade .24s ease both}
.sheet .inner{animation:sheetUp .42s cubic-bezier(.22,1.12,.34,1) both;
  border:1px solid rgba(255,255,255,.45);box-shadow:0 -6px 44px rgba(10,15,30,.30)}
@keyframes glassFade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(30px) scale(.985);opacity:0}to{transform:none;opacity:1}}

/* View content eases in on a tab change (not on background sync). */
#app.anim{animation:viewIn .30s cubic-bezier(.22,1,.36,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* Tactile press feedback everywhere it's tappable. */
button.btn,.chk,nav.tabs button,label.btn{transition:transform .13s cubic-bezier(.22,1,.36,1),background .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease}
button.btn:active,.chk:active,label.btn:active{transform:scale(.955)}
nav.tabs button:active{transform:scale(.93)}
nav.tabs button.on{text-shadow:0 0 12px rgba(201,162,90,.4)}
.docket{transition:transform .15s cubic-bezier(.22,1,.36,1),box-shadow .22s ease}
.docket:active{transform:scale(.985)}
@media(hover:hover){.docket:hover{transform:translateY(-1px);box-shadow:0 1px 2px rgba(22,33,62,.06),0 16px 40px rgba(22,33,62,.12)}
  button.btn:hover{filter:brightness(1.04)}}
.card{transition:box-shadow .25s ease}
.tag,.avatar{transition:transform .15s ease,background .2s ease}

/* Toasts glide up instead of appearing. */
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Honour the OS "reduce motion" setting: keep it usable, drop the movement. */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  #netbar{display:none}
}
</style>
</head>
<body class="theme-slate">
<div id="netbar"></div>
<header class="top">
  <div class="top-in">
    <div class="lockup">
      <img class="emblem" src="/logo.png" alt="Revanza" width="34" height="41">
      <div class="wordmark"><div class="wm">REVANZA</div><div class="ws">Task &amp; Case Console</div></div>
    </div>
    <div class="clock" id="clock">—</div>
  </div>
</header>
<nav class="tabs" id="tabs"><div class="n"></div></nav>
<div class="wrap" id="app"><div class="center">Loading…</div></div>
<div id="sheet"></div>

<script>
"use strict";
/* ============================ server link ============================ */
let PIN="", TOKEN="", SKEW=0, LINKERR="", MEDIA={};

/* Slim top progress bar — gives the interface an instant reaction to every tap,
   so a slow network reads as "working" rather than "frozen". */
let INFLIGHT=0, NETDONE=null;
function netStart(){INFLIGHT++;const b=document.getElementById("netbar");if(b){clearTimeout(NETDONE);b.classList.remove("done");b.classList.add("on")}}
function netEnd(){INFLIGHT=Math.max(0,INFLIGHT-1);if(INFLIGHT)return;const b=document.getElementById("netbar");if(!b)return;b.classList.remove("on");b.classList.add("done");NETDONE=setTimeout(()=>b.classList.remove("done"),480)}

async function call(path,opts){
  const o=Object.assign({headers:{}},opts||{});
  o.headers["content-type"]="application/json";
  if(TOKEN)o.headers.authorization="Bearer "+TOKEN;
  netStart();
  try{
    let r;
    try{r=await fetch(path,o)}
    catch(e){LINKERR="No connection.";throw new Error("No connection. Check your signal and try again.")}
    let j={}, raw="";
    try{raw=await r.text(); j=raw?JSON.parse(raw):{}}catch(e){}
    if(j&&j.serverNow)SKEW=new Date(j.serverNow).getTime()-Date.now();
    if(r.status===401){TOKEN="";clearCreds();throw new Error(j.error||"Your session has expired. Sign in again.")}
    if(!r.ok&&!j.conflict){
      /* a crashed function returns HTML, not JSON — show whatever it did say */
      const plain=raw.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,240);
      LINKERR=j.error||(plain?("The server said "+r.status+": "+plain):("The server said "+r.status));
      throw new Error(LINKERR);
    }
    LINKERR="";
    return j;
  } finally { netEnd(); }
}

/** The same call shape the console has always used, now over HTTP. */
async function api(action,payload){
  const p=payload||{};
  switch(action){
    case "bootstrap": return call("/api/docket?action=staff");
    case "signIn": {
      const r=await call("/api/docket",{method:"POST",body:JSON.stringify({action:"signIn",who:p.who||ME,pin:p.pin})});
      TOKEN=r.token; return r;
    }
    case "load": return call("/api/docket?action=board");
    case "save": return call("/api/docket",{method:"POST",body:JSON.stringify({action:"save",data:p.data,expectRev:p.expectRev})});
    case "setPin": return call("/api/docket",{method:"POST",body:JSON.stringify(Object.assign({action:"setPin"},p))});
    case "savePhoto": return call("/api/docket",{method:"POST",body:JSON.stringify({action:"media",dataUrl:p.dataUrl,kind:p.kind||"photo"})});
    case "saveVoice": {
      let id="";

function lastUpdate(t){return t.log.length?t.log[t.log.length-1]:null}

function hearingSoon(t,d=7){const h=t.case&&t.case.nextHearing;if(!h||!open_(t))return false;const n=daysTo(h);return n!==null&&n>=0&&n<=d}

function attSummary(uid,day){const a=attFor(uid,day);let ms=0,open=null;
  a.forEach(e=>{if(e.kind==="in"){if(!open)open=new Date(e.at)}else if(open){ms+=new Date(e.at)-open;open=null}});
  if(open&&day===today())ms+=now()-open;
  return {events:a,inAt:(a.find(e=>e.kind==="in")||{}).at,outAt:(a.slice().reverse().find(e=>e.kind==="out")||{}).at,
    hours:ms?(ms/36e5).toFixed(2):"",inside:!!open,last:a.length?a[a.length-1].kind:null}}
function lateBy(uid){const su=attSummary(uid,today());if(!su.inAt)return null;
  const[h,m]=(CORE.settings.shiftStart||"09:30").split(":").map(Number);const d=new Date(su.inAt);
  const mins=(d.getHours()*60+d.getMinutes())-(h*60+m);return mins>5?mins:null}

function stageOverdue(t){const x=nextStage(t);return !!(open_(t)&&x&&x.due&&daysTo(x.due)<0)}
function stageDueToday(t){const x=nextStage(t);return !!(open_(t)&&x&&x.due&&daysTo(x.due)===0)}

  const d=x.due?daysTo(x.due):null;

  const chips=[];

  if(overdue(t))chips.push(`<span class="tag overdue">${-daysTo(t.deadline)}d overdue</span>`);
  else if(t.deadline&&open_(t))chips.push(`<span class="tag">due ${fmtd(t.deadline)}</span>`);
  if(followDue(t))chips.push(`<span class="tag due">follow-up</span>`);
  else if(t.followUp&&open_(t))chips.push(`<span class="tag">f/u ${fmtd(t.followUp)}</span>`);
  if(t.case&&t.case.nextHearing&&open_(t))chips.push(`<span class="tag hear">hearing ${fmtd(t.case.nextHearing)}</span>`);
  if(nextStage(t)&&open_(t))chips.push(`<span class="tag ${stageOverdue(t)?"overdue":stageDueToday(t)?"due":""}">${esc(stageLabel(t))}</span>`);
  return `<div class="docket" data-act="open" data-id="${t.id}" tabindex="0">
    <div class="spine ${esc(t.priority)}"></div>
    <div class="body">
      <div class="no">${esc(t.no)}${t.property?" · "+esc(t.property):""} · ${esc(nameOf(t.assignee))}</div>
      <h3>${esc(t.title)}</h3>
      <div class="row"><span class="tag st-${esc(st)}">${esc(t.status)}</span>${chips.join("")}</div>
      <div class="tiny muted" style="margin-top:5px">${l?`${esc(nameOf(l.by))} · ${fmt(l.at)}${l.comment?" · "+esc(l.comment.slice(0,70)):""}`:"No update yet · assigned "+fmt(t.createdAt)}</div>

}

function applyF(list){
  let a=list.filter(visible);

  if(FILTER.q){const q=FILTER.q.toLowerCase();a=a.filter(t=>JSON.stringify(t).toLowerCase().includes(q))}
  return a.sort((x,y)=>(open_(y)-open_(x))||(CRIT.indexOf(y.priority)-CRIT.indexOf(x.priority))||(new Date(y.createdAt)-new Date(x.createdAt)));
}

async function saveAtt(kind,noPhoto){
  const shot=currentShot();
  if(!shot&&!noPhoto)return toast("No photo yet. Tap “Open camera”, or “Use phone camera” if the camera won't open.");
  const su=attSummary(ME,today());
  if(kind==="in"&&su.last==="in")return toast("You're already marked in. Mark exit first.");
  if(kind==="out"&&su.last!=="in")return toast("Mark your entry before marking exit.");
  let pid="a"+Date.now().toString(36);
  if(shot){
    try{const up=await api("savePhoto",{dataUrl:shot,kind:"attendance"}); pid=up.id; MEDIA[pid]=shot}
    catch(e){return toast("The photo wouldn't file: "+e.message)}}
  const saved=await mutate(c=>{c.att=c.att||[];c.att.push({id:pid,by:ME,kind,at:iso(now()),gps:GPS||null,
    note:val("gpsManual")||"",photo:shot?pid:"",upload:!!SHOTUP,unverified:!shot})});
  if(!saved)return;
  FACING="environment"; closeSheet();
  toast((kind==="in"?"Entry marked at ":"Exit marked at ")+tstr(now())+(shot?"":" — no photo, flagged"),"ok");
}

/* -------- reminders -------- */
function digestFor(uid){
  const a=tasksFor(uid), p=a.filter(needsEOD), f=a.filter(followDue), o=a.filter(overdue), hh=a.filter(t=>hearingSoon(t));
  const noAtt=!attSummary(uid,today()).inAt;
  if(!p.length&&!f.length&&!o.length&&!hh.length&&!noAtt)return null;
  const L=t=>`• ${t.no} — ${t.title} [${t.status}]${t.deadline?" · due "+fmtd(t.deadline):""}`;
  let b=`Good morning ${nameOf(uid)},\n\nStatus pending on your docket as of ${fmtd(today())}.\n`;
  if(p.length)b+=`\nNo update posted today (${p.length}):\n`+p.map(L).join("\n")+"\n";
  if(o.length)b+=`\nPast deadline (${o.length}):\n`+o.map(L).join("\n")+"\n";
  if(f.length)b+=`\nFollow-up falls today or earlier (${f.length}):\n`+f.map(L).join("\n")+"\n";
  const sg=a.filter(t=>stageOverdue(t)||stageDueToday(t));
  if(sg.length)b+=`\nStage due (${sg.length}):\n`+sg.map(t=>`• ${t.no} — ${stageLabel(t)}`).join("\n")+"\n";
  if(hh.length)b+=`\nHearing within 7 days (${hh.length}):\n`+hh.map(t=>`• ${t.no} — ${t.title} · ${fmtd(t.case.nextHearing)} · ${t.case.court||"court n/a"}`).join("\n")+"\n";
  const su=attSummary(uid,today());
  if(!su.inAt)b+=`\nAttendance: entry not marked today.\n`;
  b+=`\nPlease open the console and post your update before ${CORE.settings.eod} today.\n\n— ${CORE.settings.officeName} task console`;
  if(!p.length&&!o.length&&!f.length)return {subject:`[Docket] Attendance not marked — ${fmtd(today())}`,body:b};
  return {subject:`[Docket] ${p.length+o.length+f.length} pending update${p.length+o.length+f.length===1?"":"s"} — ${fmtd(today())}`,body:b};
}

function stageRow(box,name,days){
  const i=box.children.length;
  const d=document.createElement("div");
  d.className="grid2"; d.style.cssText="align-items:end;border-left:2px solid var(--line);padding-left:8px;margin-top:6px";

     <button class="btn ghost sm" type="button" data-act="delstage">Remove</button></div></div>`;

function readStages(box,from){
  let cum=0; const out=[];
  [...box.children].forEach(row=>{
    const n=row.querySelector(".st-n").value.trim();
    const d=Math.max(0,parseInt(row.querySelector(".st-d").value,10)||0);
    if(!n)return;
    cum+=d;
    const due=new Date(from+"T00:00:00"); due.setDate(due.getDate()+cum);
    out.push({n,rule:"T+"+cum,due:dstr(due),done:false,at:"",by:""});
  });
  return out;
}
async function saveTask(){
  const who=val("n_who");
  if(!who)return toast("There's nobody else to assign this to.");
  if(who===ME)return toast("You can't assign a task to yourself.");
  let due=val("n_due");
  if(due&&due<today())return toast("Deadline can't be in the past.");
  let prop=val("n_prop");
  if(!prop)return toast("Which property or company is this for?");
  if(prop==="__none")prop="";
  if(prop==="Others"){const x=val("n_propx"); prop=x?x:"Others"}
  const title=val("n_title");
  if(!title)return toast("Give the task a title.");
  const stg=readStages(document.getElementById("n_stages"),today());
  if(stg.length&&!due)due=stg[stg.length-1].due;
  const t={
    id:"t"+Date.now().toString(36),no:"",title,desc:val("n_desc"),type:"General",
    assignee:who,assigner:ME,priority:"Medium",deadline:due||"",
    property:prop,fields:[],links:[],stages:stg,status:"Not started",followUp:"",createdAt:iso(now()),history:[],log:[],case:null
  };
  await mutate(c=>{c.seq=(c.seq||0)+1;t.no="DK-"+String(c.seq).padStart(4,"0");c.tasks.push(t)});
  closeSheet();toast("Task assigned to "+nameOf(t.assignee),"ok");
}

      h+=`<div class="row" style="border-left:3px solid ${x.done?"var(--ok)":late?"var(--crit)":"var(--line)"};padding:6px 0 6px 9px;margin-bottom:5px">
        <div style="flex:1;min-width:0">
          <div class="small"><b>${i+1}. ${esc(x.n)}</b>${x.rule?` <span class="tiny muted mono">${esc(x.rule)}</span>`:""}</div>
          <div class="tiny muted">${x.done?`done ${fmt(x.at)} · ${esc(nameOf(x.by))}`:x.due?`due ${fmtd(x.due)}${late?` · ${-daysTo(x.due)}d late`:""}`:"no date"}</div>
        </div>
        ${(!x.done&&canAct&&now_)?`<button class="btn sm" data-act="stagedone" data-id="${t.id}" data-i="${i}">Mark done</button>`:""}
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`</div></div>`;
  if(canAct)h+=`<div class="btnrow"><button class="btn seal" data-act="update" data-id="${t.id}">Post update</button>
    <button class="btn ghost" data-act="handover" data-id="${t.id}">Hand over</button>
    ${isOwner()||t.assigner===ME?`<button class="btn ghost" data-act="editfields" data-id="${t.id}">Edit task</button>`:""}
    ${isOwner()?`<button class="btn ghost" data-act="archive" data-id="${t.id}" style="margin-left:auto;color:var(--seal);border-color:var(--seal)">Archive</button>`:""}</div>`;
  h+=`<div class="sec-head"><h2 style="font-size:17px">Update history</h2><span class="eyebrow">${t.log.length}</span></div><div class="card pad">${logHtml(t)}</div>`;
  sheet(h);
  loadPhotos(); loadAudio();
}
function logHtml(t){
  if(!t.log.length)return `<p class="small muted" style="margin:0">No updates posted yet.</p>`;
  return `<div class="log">`+t.log.slice().reverse().map(l=>{
    const bit=(lbl,v)=>v?`<div class="kv" style="margin:3px 0"><div class="k">${lbl}</div><div>${nl(v)}</div></div>`:"";
    return `<div class="e"><div class="st">${fmt(l.at)} · ${esc(nameOf(l.by))}${l.late?` · <span style="color:var(--seal)">posted after cut-off</span>`:""}</div>
    <div><b>${esc(l.reassignTo?"Handed over to "+nameOf(l.reassignTo):l.status)}</b></div>
    ${l.comment?`<div class="small">${nl(l.comment)}</div>`:""}
    ${bit("Completed at",l.endTime?fmt(l.endTime):"")}${bit("Delay",l.delay)}${bit("Issues",l.issues)}${bit("Linked issue",l.linkIssue)}
    ${bit("Next follow-up",l.followUp?fmtd(l.followUp):"")}${bit("Next process",l.next)}${bit("Criticality set to",l.priority)}
    ${l.audio?`<audio data-audio="${l.audio}" controls style="width:100%;margin-top:6px"></audio>`:""}
    ${l.voiceText?`<div class="small" style="background:#f7f8fb;border:1px solid var(--line);border-radius:7px;padding:8px;margin-top:6px"><span class="eyebrow">Voice note, written out</span><br>${nl(l.voiceText)}</div>`:""}
    ${l.photo?`${l.upload?`<div class="tiny muted" style="margin-top:6px">Picture added from the phone, not captured live.</div>`:""}<img class="thumb" data-photo="${l.photo}" alt="Site photo">${l.gps?`<div class="tiny muted">GPS ${l.gps.lat.toFixed(6)}, ${l.gps.lng.toFixed(6)} · <a href="https://maps.google.com/?q=${l.gps.lat},${l.gps.lng}" target="_blank" rel="noopener">Map</a></div>`:`<div class="tiny muted">GPS unavailable · ${esc(l.gpsNote||"")}</div>`}`:""}
    </div>`}).join("")+`</div>`;
}

let STREAM=null, SHOT=null, SHOTUP=false, GPS=null, FACING="environment";
async function grabGPS(){
  const el=document.getElementById("gpsState"); if(!el)return;
  if(!navigator.geolocation){el.textContent=" · GPS not supported — add a location note";showManual();return}
  navigator.geolocation.getCurrentPosition(p=>{GPS={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
    const e2=document.getElementById("gpsState");if(e2)e2.innerHTML=` · GPS ${GPS.lat.toFixed(5)}, ${GPS.lng.toFixed(5)} (±${Math.round(GPS.acc)}m)`},
   ()=>{const e2=document.getElementById("gpsState");if(e2)e2.textContent=" · GPS blocked — add a location note";showManual()},
   {enableHighAccuracy:true,timeout:10000,maximumAge:0});
}
function showManual(){["gpsManualWrap","gpsManual"].forEach(i=>{const e=document.getElementById(i);if(e)e.classList.remove("hide")})}
async function startCam(){
  const v=document.getElementById("vid");
  try{
    STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:FACING},width:{ideal:1280}},audio:false});
    v.srcObject=STREAM; await v.play(); v.classList.remove("hide");
    document.getElementById("camBtns").classList.remove("hide");
  }catch(e){
    toast("Live camera is blocked here. Tap “Use phone camera” instead.");
  }
}
/* one delegated listener, so the picture is picked up however it arrives */
document.addEventListener("change",e=>{
  if(!e.target||e.target.id!=="fileCam")return;
  const file=e.target.files&&e.target.files[0]; if(!file)return;
  const img=new Image();
  img.onload=()=>{stampAndStore(img,img.naturalWidth||img.width,img.naturalHeight||img.height,true);URL.revokeObjectURL(img.src)};
  img.onerror=()=>toast("That picture wouldn't open. Try taking it again.");
  img.src=URL.createObjectURL(file);
});
/* the capture survives even if the page state is rebuilt underneath it */
function currentShot(){
  if(SHOT)return SHOT;
  const c=document.getElementById("cnv");
  if(c&&c.width>10){try{return c.toDataURL("image/jpeg",.62)}catch(err){}}
  return null;
}
function stopCam(){if(STREAM){STREAM.getTracks().forEach(t=>t.stop());STREAM=null}}
function shoot(){
  const v=document.getElementById("vid"); if(!v||!v.videoWidth)return toast("Camera still starting.");
  stampAndStore(v,v.videoWidth,v.videoHeight);
}
function stampAndStore(src,w,h,viaUpload){
  const max=1100, sc=Math.min(1,max/Math.max(w,h)), W=Math.round(w*sc), H=Math.round(h*sc);
  const c=document.getElementById("cnv"); c.width=W;c.height=H;
  const x=c.getContext("2d"); x.drawImage(src,0,0,W,H);
  const lines=[
    now().toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"}),
    nameOf(ME)+" · "+CORE.settings.officeName,
    GPS?`GPS ${GPS.lat.toFixed(6)}, ${GPS.lng.toFixed(6)} ±${Math.round(GPS.acc)}m`:"GPS unavailable at capture"
  ];
  if(viaUpload)lines.push("PICTURE ADDED FROM PHONE — TIME IS UPLOAD TIME");
  const fs=Math.max(13,Math.round(W/38)), pad2=Math.round(fs*.5), bh=fs*lines.length+pad2*2.2;
  x.fillStyle="rgba(10,15,30,.72)"; x.fillRect(0,H-bh,W,bh);
  x.fillStyle="#fff"; x.font=`600 ${fs}px ui-monospace,Menlo,monospace`; x.textBaseline="top";
  lines.forEach((l,i)=>x.fillText(l,pad2*1.4,H-bh+pad2+i*fs*1.05));
  c.classList.remove("hide");
  const v=document.getElementById("vid"); if(v)v.classList.add("hide");
  document.getElementById("camBtns").classList.add("hide");
  stopCam();
  try{SHOT=c.toDataURL("image/jpeg",.62)}catch(err){SHOT=null;toast("The picture couldn't be stamped. Try again.");return}
  SHOTUP=!!viaUpload;
  const a=document.getElementById("camArea");
  if(a)a.innerHTML=`<span class="tiny" style="color:var(--ok)">✓ Photo ready${viaUpload?" (added from phone)":" and stamped"}.</span> <button class="btn ghost sm" type="button" data-act="retake">Take another</button>`;
}
/* ---- voice recorder ---- */
let REC=null,RCHUNKS=[],RSTREAM=null,RAUDIO=null,RMIME="audio/webm",RSTART=0,RDUR=0,RTIMER=null,SRE=null;
async function startRec(){
  try{RSTREAM=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){toast("Microphone blocked here — type the note instead.");return}
  RCHUNKS=[];RAUDIO=null;
  try{REC=new MediaRecorder(RSTREAM)}catch(e){try{REC=new MediaRecorder(RSTREAM,{mimeType:"audio/webm"})}catch(e2){toast("Recording isn't supported in this browser — type the note.");return}}
  RMIME=REC.mimeType||"audio/webm";
  REC.ondataavailable=e=>{if(e.data&&e.data.size)RCHUNKS.push(e.data)};
  REC.onstop=()=>{const b=new Blob(RCHUNKS,{type:RMIME});const fr=new FileReader();
    fr.onload=()=>{RAUDIO=fr.result;const pl=document.getElementById("recPlay");if(pl){pl.src=RAUDIO;pl.classList.remove("hide")}};
    fr.readAsDataURL(b)};
  REC.start(); RSTART=Date.now(); startSR();
  const a=document.getElementById("recArea");
  if(a)a.innerHTML=`<button class="btn seal sm" type="button" data-act="recstop">Stop recording</button> <span class="tiny mono" id="recState">● 0:00</span>`;
  RTIMER=setInterval(()=>{const sec=Math.floor((Date.now()-RSTART)/1000);const e=document.getElementById("recState");
    if(e)e.textContent="● "+Math.floor(sec/60)+":"+pad(sec%60);
    if(sec>=180){toast("Three minutes reached — recording stopped.");stopRec()}},250);
}
function stopRec(){
  if(RTIMER){clearInterval(RTIMER);RTIMER=null}
  RDUR=RSTART?Math.round((Date.now()-RSTART)/1000):0;
  if(REC&&REC.state!=="inactive"){try{REC.stop()}catch(e){}}
  if(RSTREAM){RSTREAM.getTracks().forEach(t=>t.stop());RSTREAM=null}
  stopSR();
  const a=document.getElementById("recArea");
  if(a)a.innerHTML=`<span class="tiny" style="color:var(--ok)">Recorded ${RDUR}s.</span> <button class="btn ghost sm" type="button" data-act="rec">Record again</button>`;
}
function startSR(){
  const C=window.SpeechRecognition||window.webkitSpeechRecognition, ta=document.getElementById("v_text");
  if(!ta)return;
  if(!C){if(!ta.value)ta.placeholder="This browser can't write speech out automatically — type the note here.";return}
  try{
    SRE=new C(); const lg=document.getElementById("v_lang");
    SRE.lang=lg?lg.value:"en-IN"; SRE.continuous=true; SRE.interimResults=true;
    let fin=ta.value?ta.value+" ":"";
    SRE.onresult=e=>{let itr="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];
      if(r.isFinal)fin+=r[0].transcript+" "; else itr+=r[0].transcript}
      ta.value=(fin+itr).replace(/\s+/g," ").trim()};
    SRE.onend=()=>{if(SRE&&REC&&REC.state==="recording"){try{SRE.start()}catch(e){}}};
    SRE.start();
  }catch(e){}
}
function stopSR(){if(SRE){const x=SRE;SRE=null;try{x.onend=null;x.stop()}catch(e){}}}
async function loadAudio(){
  const els=document.querySelectorAll("audio[data-audio]");
  for(const el of els){ if(el.src)continue;
    const id=el.dataset.audio;
    if(MEDIA[id]){el.src=MEDIA[id];continue}
    try{const d=await api("media",{id}); MEDIA[id]=d.dataUrl; el.src=d.dataUrl}
    catch(e){el.replaceWith(Object.assign(document.createElement("div"),{className:"tiny muted",textContent:"Audio could not be loaded."}))}
  }
}
async function noteFiles(n){
  if(!n||!n.id)return;
  const base=nameOf(n.by).replace(/[^A-Za-z0-9]+/g,"_")+"_"+dstr(n.at)+"_"+tstr(n.at).replace(":","");
  download(base+".txt",`${nameOf(n.by)}\n${fmt(n.at)}\n${n.title||"Voice note"}\n\n${n.text||"(no transcript)"}\n`,"text/plain");
  if(n.audio){
    try{
      const d=MEDIA[n.audio]||(await api("media",{id:n.audio})).dataUrl;
      MEDIA[n.audio]=d;
      const a=document.createElement("a");a.href=d;a.download=base+(d.indexOf("audio/mp4")>-1?".m4a":".webm");
      document.body.appendChild(a);a.click();a.remove();
    }catch(e){toast("The audio would not download: "+e.message)}
  }
}
async function loadPhotos(){
  const imgs=document.querySelectorAll("img[data-photo]");
  for(const im of imgs){ if(im.src)continue;
    const id=im.dataset.photo;
    if(MEDIA[id]){im.src=MEDIA[id];continue}
    try{const d=await api("media",{id}); MEDIA[id]=d.dataUrl; im.src=d.dataUrl}
    catch(e){im.replaceWith(Object.assign(document.createElement("div"),{className:"tiny muted",textContent:"Photo could not be loaded."}))}
  }
}

/* ============================ actions ============================ */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]"); if(!el)return;
  const a=el.dataset.act, id=el.dataset.id;
  e.preventDefault();
  switch(a){
    case "pick": pinSheet(id); break;
    case "dosignin": await doSignIn(id); break;
    case "savemypin": await saveMyPin(); break;
    case "signout": ME=null;TOKEN="";MEDIA={};clearCreds();VIEW="today";
      try{const bs=await api("bootstrap");CORE=fresh();CORE.staff=bs.staff}catch(e){}
      render(); break;
    case "tab": VIEW=el.dataset.tab; render(true); window.scrollTo(0,0); break;
    case "close": closeSheet(); break;
    case "new": newTaskSheet(); break;
    case "savetask": await saveTask(); break;
    case "open": e.preventDefault(); taskSheet(id); break;
    case "update": updateSheet(id); break;
    case "saveupdate": await saveUpdate(id); break;
    case "handover": handoverSheet(id); break;
    case "savehandover": await saveHandover(id); break;
    case "editfields": fieldsSheet(id); break;
    case "savefields": await saveFields(id); break;
    case "themes": themeSheet(); break;
    case "settheme": setThemePersonal(el.dataset.theme); themeSheet(); break;
    case "themeoffice": if(isOwner()){await mutate(c=>{c.settings.theme=themePref()}); toast("Office default updated","ok"); themeSheet();} break;
    case "archive": if(!isOwner()){toast("Only the owner can archive a task.");break}
      if(confirm("Archive this task?\n\nIt will be hidden from every view but kept on record. You can restore it any time from the Archived tab."))
      {try{const r=await api("archive",{id,archived:true});CORE=r.data;CORE.rev=r.rev;closeSheet();render();toast("Task archived","ok")}catch(err){toast(err.message)}} break;
    case "restore": {try{const r=await api("archive",{id,archived:false});CORE=r.data;CORE.rev=r.rev;render();toast("Task restored","ok")}catch(err){toast(err.message)}} break;
    case "cam": SHOT=null;SHOTUP=false; startCam(); break;
    case "shoot": shoot(); break;
    case "camoff": stopCam(); document.getElementById("vid").classList.add("hide"); document.getElementById("camBtns").classList.add("hide"); break;
    case "applyfilter": FILTER={q:val("fq"),who:val("fwho"),status:val("fst"),type:val("ftp"),prop:val("fpr")}; render(); break;
    case "clearfilter": FILTER={q:"",who:"",status:"",type:"",prop:""}; render(); break;
    case "csv": exportCSV(); break;
    case "ics": exportICS(); break;
    case "mail1": mail(byId(id)); break;
    case "wa1": wa(byId(id)); break;
    case "sms1": sms(byId(id)); break;
    case "waall": {const q=(isOwner()?CORE.staff:[byId(ME)]).filter(x=>x.phone&&digestFor(x.id));
      if(!q.length){toast("Nobody pending has a mobile number saved.");break}
      wa(q[0]); if(q.length>1)toast(q.length-1+" more pending after "+q[0].name);} break;
    case "mailall": (isOwner()?CORE.staff:[byId(ME)]).forEach((s,i)=>{ if(digestFor(s.id)) setTimeout(()=>mail(s), i*700) }); break;
    case "copy1": {const d=digestFor(id); copy(d.subject+"\n\n"+d.body);} break;
    case "copyall": copy(CORE.staff.map(s=>{const d=digestFor(s.id);return d?`TO: ${s.email||s.name}\nSUBJECT: ${d.subject}\n\n${d.body}\n\n${"-".repeat(40)}\n`:""}).join("")); break;
    case "saveprops": {const list=(document.getElementById("s_props").value||"").split("\n").map(x=>x.trim()).filter(Boolean);
      if(!list.length){toast("The list can't be empty.");break}
      await mutate(c=>{c.settings.properties=list}); toast("List saved","ok")} break;
    case "savesettings": await mutate(c=>{c.settings.officeName=val("s_office")||"Office";c.settings.eod=val("s_eod")||"18:30";c.settings.reminderHour=val("s_rem")||"09:00";c.settings.shiftStart=val("s_shift")||"09:30";c.settings.dial=(val("s_dial")||"91").replace(/\D/g,"")}); toast("Settings saved","ok"); break;
    case "savestaff": {
      const edits={}; document.querySelectorAll("[data-st]").forEach(i=>{edits[i.dataset.st]=edits[i.dataset.st]||{};edits[i.dataset.st][i.dataset.f]=i.value.trim()});
      await mutate(c=>c.staff.forEach(s=>{if(edits[s.id])Object.assign(s,edits[s.id])})); toast("Team saved","ok"); break; }
    case "addstaff": await mutate(c=>c.staff.push({id:"u"+Date.now().toString(36),name:"New person",role:"Executive",email:""})); break;
    case "delstaff": if(CORE.tasks.some(t=>t.assignee===id&&open_(t)))return toast("Reassign their open tasks first.");
      if(confirm("Remove "+nameOf(id)+" from the team?"))await mutate(c=>c.staff=c.staff.filter(s=>s.id!==id)); break;
    case "markin": attSheet("in"); break;
    case "markout": attSheet("out"); break;
    case "saveatt": await saveAtt(el.dataset.kind); break;
    case "saveattnp": if(confirm("Save this mark without a photo? It will be flagged as unverified."))await saveAtt(el.dataset.kind,true); break;
    case "retake": {SHOT=null;SHOTUP=false;const c=document.getElementById("cnv");if(c){c.width=1;c.height=1;c.classList.add("hide")}
      const a2=document.getElementById("camArea");if(a2){a2.innerHTML=camButtons();grabGPS()}} break;
    case "reload": location.reload(); break;
    case "selftest": await selfTest(); break;
    case "copyreport": copy(REPORT||"No report yet."); break;
    case "health": try{const r=await fetch("/api/docket?action=diag").then(x=>x.json());
      toast(r.ok?("Server fine · "+r.database.driver+" · email "+(r.env.RESEND_API_KEY?"yes":"not set up")):("Server not ready: "+(r.nextSteps&&r.nextSteps[0]||"")),r.ok?"ok":"")}
      catch(e){toast("The server did not answer.")} break;
    case "addstage": stageRow(document.getElementById("n_stages")); break;
    case "addstage2": editStageRow(document.getElementById("e_stages")); break;
    case "delstage": {const row=el.closest(".grid2"); if(row)row.remove()} break;
    case "stagedone": await stageDone(id,Number(el.dataset.i)); break;
    case "genpin": {const e2=document.getElementById("k_pin"); if(e2)e2.value=String(Math.floor(1000+Math.random()*9000))} break;
    case "setpin": {const tgt=val("k_who"),np=val("k_pin");
      const mail=(document.getElementById("k_mail")||{}).checked;
      if(!/^[0-9]{4}$/.test(np)){toast("Four digits, please.");break}
      try{const r=await api("setPin",{target:tgt,newPin:np,notify:mail});CORE=r.data;CORE.rev=r.rev;
        render();
        toast(r.emailed?("PIN set and emailed to "+r.to):(r.mailError?("PIN set — "+r.mailError):("PIN set for "+nameOf(tgt))),"ok");
      }catch(e){toast(e.message)}} break;
    case "waipin": {const tgt=val("k_who"),np=val("k_pin"),st=byId(tgt);
      if(!/^[0-9]{4}$/.test(np)){toast("Enter or generate the PIN first.");break}
      if(!st.phone){toast("No mobile number saved for "+st.name+".");break}
      try{const r=await api("setPin",{target:tgt,newPin:np,notify:false});CORE=r.data;CORE.rev=r.rev;render()}
      catch(e){toast(e.message);break}
      const msg=`${st.name}, your PIN for the ${CORE.settings.officeName||"office"} task console is ${np}. Sign in and set your own PIN straight away.`;
      window.open(`https://wa.me/${dial(st.phone)}?text=${encodeURIComponent(msg)}`,"_blank","noopener");} break;
    case "mypin": myPinSheet(); break;
    case "sendnow": try{const r=await api("sendReminders");toast(r.sent?("Reminder sent to "+r.sent+" people"):"Nobody had anything pending","ok")}catch(e){toast(e.message)} break;
    case "attcsv": attCSV(); break;
    case "staff": staffSheet(id); break;
    case "vfilter": VFILTER=id||""; VIEW="voice"; closeSheet(); render(); break;
    case "newnote": noteSheet(); break;
    case "savenote": await saveNote(); break;
    case "rec": startRec(); break;
    case "recstop": stopRec(); break;
    case "notefiles": await noteFiles((CORE.notes||[]).find(x=>x.id===id)); break;
    case "notecopy": {const n=(CORE.notes||[]).find(x=>x.id===id); copy(`${nameOf(n.by)} · ${fmt(n.at)}\n${n.title||""}\n\n${n.text||"(no transcript)"}`)} break;
    case "notescsv": copy((isOwner()?CORE.notes:notesFor(ME)).map(n=>`${nameOf(n.by)} · ${fmt(n.at)} · ${n.title||""}\n${n.text||"(no transcript)"}\n${"-".repeat(30)}`).join("\n")); break;
    case "backup": download("docket-backup-"+today()+".json",JSON.stringify(CORE,null,1),"application/json"); break;
  }
});
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():""};

async function saveUpdate(id){
  const t=CORE.tasks.find(x=>x.id===id); if(!t)return;
  const status=val("u_status"), comment=val("u_comment");
  if(!comment)return toast("Add a comment describing what moved.");
  const u={at:iso(now()),by:ME,status,comment};
  const et=val("u_end");
  if(et){const d=new Date(today()+"T"+et+":00"); if(d>now())return toast("Completion time can't be in the future."); u.endTime=iso(d)}
  const fu=val("u_fu"); if(fu){if(fu<today())return toast("Follow-up date can't be in the past."); u.followUp=fu}
  ["delay","issues","next"].forEach(k=>{const v=val("u_"+k); if(v)u[k]=v});
  const li=val("u_link"); if(li)u.linkIssue=li;
  const pri=val("u_pri"); if(pri&&pri!==t.priority)u.priority=pri;
  let cs=null;
  if(document.querySelector('#u_toggles input[data-blk="blk_case"]').checked){
    const hear=val("c_hear"); if(hear&&hear<today())return toast("Next hearing date can't be in the past.");
    cs={court:val("c_court"),judge:val("c_judge"),counsel:val("c_counsel"),section:val("c_section"),
      lastOrder:val("c_order"),current:val("c_current"),nextAction:val("c_next"),nextHearing:hear,
      crit:val("c_crit"),phRequired:val("c_ph"),phWho:val("c_phwho"),calendared:val("c_cal"),cnr:val("c_cnr")};
    if(cs.phRequired==="Yes"&&!cs.phWho)return toast("Personal hearing needs a name from the office.");
    if(cs.nextHearing&&cs.calendared!=="Yes")toast("Note: the hearing isn't marked as put in the calendar.");
  }
  const shot=currentShot();
  if(shot){
    let up; try{up=await api("savePhoto",{dataUrl:shot,kind:"task"})}
    catch(e){return toast("The photo wouldn't file, so nothing was posted: "+e.message)}
    MEDIA[up.id]=shot;
    u.photo=up.id; u.upload=!!SHOTUP; if(GPS)u.gps=GPS; else u.gpsNote=val("gpsManual")}
  let note=null;
  if(RAUDIO||val("v_text")){
    let v; try{v=await api("saveVoice",{dataUrl:RAUDIO||"",text:val("v_text"),title:t.no+" — "+t.title})}
    catch(e){return toast("The voice note wouldn't file: "+e.message)}
    u.voiceText=val("v_text");
    if(v.id){u.audio=v.id; MEDIA[v.id]=RAUDIO}
    note={id:v.id||("n"+Date.now().toString(36)),by:ME,at:iso(now()),title:t.no+" — "+t.title,
      text:u.voiceText,audio:v.id||"",doc:v.doc||"",dur:RDUR,task:t.id};
  }
  const [eh,em]=(CORE.settings.eod||"18:30").split(":").map(Number);
  const nn=now(); u.late=(nn.getHours()*60+nn.getMinutes())>(eh*60+em);
  await mutate(c=>{if(note){c.notes=c.notes||[];c.notes.push(note)}
    const x=c.tasks.find(y=>y.id===id); x.log.push(u); x.status=status;
    if(u.followUp)x.followUp=u.followUp; if(u.priority)x.priority=u.priority;
    if(cs){x.case=cs; if(x.type==="General")x.type="Legal case"}
    if(u.photo&&x.type==="General")x.type="Field visit";
    if(status==="Completed"){x.completedAt=u.endTime||u.at; x.followUp=""}});
  SHOT=null; GPS=null; RAUDIO=null; RDUR=0; closeSheet(); toast("Update posted","ok");
}
async function stageDone(id,i){
  const t=CORE.tasks.find(x=>x.id===id), x=stages(t)[i];
  if(!x||x.done)return;
  if(!confirm(`Mark “${x.n}” as done? The time is set by the office clock and can't be changed afterwards.`))return;
  await mutate(c=>{const y=c.tasks.find(z=>z.id===id), st=y.stages[i];
    st.done=true; st.at=iso(now()); st.by=ME;
    y.log.push({at:iso(now()),by:ME,status:y.status==="Not started"?"In progress":y.status,
      comment:"Stage done: "+st.n,stage:st.n});
    if(y.status==="Not started")y.status="In progress";
  });
  const left=stages(CORE.tasks.find(z=>z.id===id)).filter(z=>!z.done).length;
  toast(left?left+" stage(s) to go":"All stages done — post the final update to close it","ok");
  taskSheet(id);
}
async function saveHandover(id){
  const to=val("h_who"), note=val("h_note"), fu=val("h_fu");
  if(!note)return toast("Write a handover note so the next person can pick it up.");
  await mutate(c=>{const t=c.tasks.find(x=>x.id===id);
    t.history=(t.history||[]).concat([t.assignee]);
    t.log.push({at:iso(now()),by:ME,status:"Reassigned",comment:note,reassignTo:to,followUp:fu||""});
    t.assignee=to; t.status="Reassigned"; if(fu)t.followUp=fu});
  closeSheet(); toast("Handed to "+nameOf(to),"ok");
}
async function saveFields(id){
  const t0=CORE.tasks.find(x=>x.id===id);
  const title=val("e_title"); if(!title)return toast("The task needs a title.");
  const due=val("e_due"); if(due&&due<today())return toast("Deadline can't be in the past.");
  const who=val("e_who"); if(who===t0.assigner)return toast("A task can't sit with the person who assigned it.");
  const old=stages(t0);
  const st=[...document.querySelectorAll("#e_stages > div")].map((row,i)=>{
    const n=row.querySelector(".es-n").value.trim();
    const d=row.querySelector(".es-due").value;
    if(!n)return null;
    const was=row.dataset.i!==undefined?old[Number(row.dataset.i)]:null;
    return was&&was.done?was:{n,rule:was?was.rule:"",due:d,done:false,at:"",by:""};
  }).filter(Boolean);
  const notes=[];
  if(title!==t0.title)notes.push("title");
  if(val("e_desc")!==(t0.desc||""))notes.push("detail");
  if(who!==t0.assignee)notes.push("moved to "+nameOf(who));
  if(due!==(t0.deadline||""))notes.push("deadline "+(due?fmtd(due):"cleared"));
  if(val("e_prop")!==(t0.property||""))notes.push("property "+(val("e_prop")||"cleared"));
  if(JSON.stringify(st)!==JSON.stringify(old))notes.push("stages");
  await mutate(c=>{const t=c.tasks.find(x=>x.id===id);
    if(who!==t.assignee)t.history=(t.history||[]).concat([t.assignee]);
    t.title=title;t.desc=val("e_desc");t.assignee=who;t.priority=val("e_pri");t.deadline=due;t.stages=st;t.property=val("e_prop");
    if(notes.length)t.log.push({at:iso(now()),by:ME,status:t.status,comment:"Task edited by "+nameOf(ME)+": "+notes.join(", "),edit:true});
  });
  closeSheet(); toast("Saved","ok");
}

document.addEventListener("change",async e=>{
  if(!e.target||e.target.id!=="restoreFile")return;
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const txt=await f.text();
  let data; try{data=JSON.parse(txt)}catch(err){return toast("That file isn't a board backup.")}
  if(!data||!data.staff||!Array.isArray(data.tasks))return toast("That file isn't a board backup.");
  if(!confirm(`Replace the board with this backup? ${data.tasks.length} tasks, ${data.staff.length} people. The board as it stands now will be gone.`))return;
  try{const r=await api("save",{data,expectRev:CORE.rev});
    if(r.ok){CORE=r.data;CORE.rev=r.rev;render();toast("Board restored","ok")}
    else toast("Someone saved while that was uploading. Try again.")}
  catch(e){toast(e.message)}
});

/* ============================ export ============================ */
function download(name,text,type){
  try{const b=new Blob([text],{type:type||"text/plain"}),u=URL.createObjectURL(b),a=document.createElement("a");
   a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast("Downloaded "+name,"ok")}
  catch(e){copy(text)}
}
function copy(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast("Copied","ok"),()=>fallbackCopy(text))}
  else fallbackCopy(text);
}
function fallbackCopy(text){
  sheet(`<div class="bar"><h2 style="font-size:18px">Copy this</h2><button class="btn ghost sm" data-act="close">Close</button></div>
  <div class="card pad"><textarea style="min-height:50vh;font-family:var(--mono);font-size:12px">${esc(text)}</textarea></div>`);
  const t=document.querySelector(".sheet textarea"); t.focus(); t.select();
}
function exportCSV(){
  const H=["Docket","Property / company","Title","Type","Assignee","Assigned by","Priority","Status","Deadline","Next follow-up","Last update","Last comment","Court","Judge","Counsel","Sections","Next hearing","Personal hearing","Attends","In calendar","Current status","Next action"];
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const rows=applyF(CORE.tasks).map(t=>{const l=lastUpdate(t)||{},k=t.case||{};
   return [t.no,t.property||"",t.title,t.type,nameOf(t.assignee),nameOf(t.assigner),t.priority,t.status,t.deadline,t.followUp,l.at?fmt(l.at):"",l.comment||"",k.court,k.judge,k.counsel,k.section,k.nextHearing,k.phRequired,k.phWho,k.calendared,k.current,k.nextAction].map(q).join(",")});
  download("docket-"+today()+".csv",H.map(q).join(",")+"\n"+rows.join("\n"),"text/csv");
}
function attCSV(){
  const q=x=>'"'+String(x==null?"":x).replace(/"/g,'""')+'"';
  const rows=[["Date","Person","Role","Entry","Exit","Hours","Late by (min)","Entry GPS","Exit GPS"].map(q).join(",")];
  const days=[...new Set((CORE.att||[]).map(a=>dstr(a.at)))].sort().reverse();
  days.forEach(d=>CORE.staff.forEach(s=>{const su=attSummary(s.id,d); if(!su.events.length)return;
    const i=su.events.find(e=>e.kind==="in"), o=su.events.slice().reverse().find(e=>e.kind==="out");
    const g=e=>e&&e.gps?e.gps.lat.toFixed(6)+", "+e.gps.lng.toFixed(6):(e?e.note||"no gps":"");
    rows.push([d,s.name,s.role,su.inAt?tstr(su.inAt):"",su.outAt?tstr(su.outAt):"",su.hours,d===today()?(lateBy(s.id)||""):"",g(i),g(o)].map(q).join(","))}));
  if(rows.length===1)return toast("No attendance marked yet.");
  download("attendance-"+today()+".csv",rows.join("\n"),"text/csv");
}
function exportICS(){
  const stamp=d=>d.replace(/-/g,"");
  const ev=[];
  CORE.tasks.filter(t=>t.case&&t.case.nextHearing&&open_(t)).forEach(t=>ev.push(
   `BEGIN:VEVENT\nUID:${t.id}-h@docket\nDTSTAMP:${iso(now()).replace(/[-:]/g,"").split(".")[0]}Z\nDTSTART;VALUE=DATE:${stamp(t.case.nextHearing)}\nSUMMARY:Hearing — ${t.title}\nDESCRIPTION:${t.no} | ${t.case.court||""} | ${t.case.judge||""} | Counsel ${t.case.counsel||""} | Attends ${t.case.phWho||"—"}\nEND:VEVENT`));
  CORE.tasks.filter(t=>t.followUp&&open_(t)).forEach(t=>ev.push(
   `BEGIN:VEVENT\nUID:${t.id}-f@docket\nDTSTAMP:${iso(now()).replace(/[-:]/g,"").split(".")[0]}Z\nDTSTART;VALUE=DATE:${stamp(t.followUp)}\nSUMMARY:Follow-up — ${t.title}\nDESCRIPTION:${t.no} | with ${nameOf(t.assignee)}\nEND:VEVENT`));
  if(!ev.length)return toast("No hearing or follow-up dates to export yet.");
  download("docket-dates.ics","BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Docket//EN\n"+ev.join("\n")+"\nEND:VCALENDAR","text/calendar");
}
function shortDigest(uid){
  const a=tasksFor(uid), p=a.filter(needsEOD), o=a.filter(overdue), f=a.filter(followDue);
  const L=t=>`${t.no} ${t.title}${t.deadline?" (due "+fmtd(t.deadline)+")":""}`;
  let m=`${nameOf(uid)}, status pending as on ${fmtd(today())}:\n`;
  if(p.length)m+=`\nNo update today:\n`+p.map(L).join("\n")+"\n";
  if(o.length)m+=`\nPast deadline:\n`+o.map(L).join("\n")+"\n";
  if(f.length)m+=`\nFollow-up due:\n`+f.map(L).join("\n")+"\n";
  const sg=a.filter(t=>stageOverdue(t)||stageDueToday(t));
  if(sg.length)m+=`\nStage due:\n`+sg.map(t=>`${t.no} ${stageLabel(t)}`).join("\n")+"\n";
  if(!attSummary(uid,today()).inAt)m+=`\nAttendance entry not marked.\n`;
  m+=`\nPlease update before ${CORE.settings.eod}.`;
  return m;
}
function wa(s){
  if(!s)return; if(!s.phone)return toast("No mobile number saved for "+s.name+".");
  if(!digestFor(s.id))return toast("Nothing pending for "+s.name);
  window.open(`https://wa.me/${dial(s.phone)}?text=${encodeURIComponent(shortDigest(s.id))}`,"_blank","noopener");
}
function sms(s){
  if(!s)return; if(!s.phone)return toast("No mobile number saved for "+s.name+".");
  if(!digestFor(s.id))return toast("Nothing pending for "+s.name);
  location.href=`sms:+${dial(s.phone)}?&body=${encodeURIComponent(shortDigest(s.id))}`;
}
function mail(s){
  const d=digestFor(s.id); if(!d)return toast("Nothing pending for "+s.name);
  const to=s.email||"";
  location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(d.body)}`;
}
